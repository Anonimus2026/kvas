<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доступ запрещён</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { text-align: center; max-width: 500px; padding: 40px; }
.icon { font-size: 64px; margin-bottom: 20px; }
h1 { color: #ff6b6b; font-size: 24px; margin-bottom: 12px; }
p { color: #888; font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
.url { color: #58a6ff; font-family: monospace; background: #161b22; padding: 8px 16px; border-radius: 6px; display: inline-block; margin: 16px 0; word-break: break-all; }
.footer { margin-top: 30px; font-size: 11px; color: #444; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">🚫</div>
  <h1>Доступ запрещён</h1>
  <p>Этот сайт заблокирован родительским контролем KVAS.</p>
  <div class="url" id="blockedUrl"></div>
  <p>Если вы считаете, что это ошибка, обратитесь к администратору сети.</p>
  <div class="footer">KVAS Parental Control</div>
</div>
<script>
var url = window.location.href;
document.getElementById('blockedUrl').textContent = url;
</script>
</body>
</html>
