# Пример конфигурации AmneziaWG 3.1 с локальным SOCKS5/HTTP прокси
[Interface]
Address = 10.8.0.2/32
PrivateKey = aaaaaa...=
DNS = 1.1.1.1

# Базовые параметры обфускации AWG 1.0 / 2.0
Jc = 4
Jmin = 40
Jmax = 70
S1 = 15
S2 = 25
H1 = 1-100
H2 = 101-200
H3 = 201-300
H4 = 301-400

# Расширенные параметры обфускации AWG 3.0 / 3.1
HeaderProtectionKey = bbbbbb...=
ContentPaddingAddition = 10-50
RekeyAfterTime = 60-120
RandomTrailers = on
DisableCookies = on

[Peer]
PublicKey = cccccc...=
Endpoint = 198.51.100.1:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25

[Socks5]
BindAddress = @PROXY_LOCAL_IP:@PROXY_LOCAL_PORT_SOCKS

[Http]
BindAddress = @PROXY_LOCAL_IP:@PROXY_LOCAL_PORT_HTTP
